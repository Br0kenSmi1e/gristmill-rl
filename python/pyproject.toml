[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gristmill-symbolics"
version = "0.1.0"
requires-python = ">=3.11"
description = "Python bindings and RL prototype for the gristmill-symbolics rewrite kernel"
dependencies = [
    "flax>=0.12",
    "jax>=0.5",
    "numpy>=2.0",
    "orbax-checkpoint>=0.11",
    "optax>=0.2",
]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
]

[tool.maturin]
bindings = "pyo3"
exclude = [
    "gristmill_rl/**/__pycache__",
    "gristmill_rl/**/*.pyc",
    "reinforce_training/**/__pycache__",
    "reinforce_training/**/*.pyc",
    "transformer_policy/**/__pycache__",
    "transformer_policy/**/*.pyc",
]
module-name = "gristmill_symbolics"
manifest-path = "Cargo.toml"
python-packages = ["gristmill_rl", "transformer_policy", "reinforce_training"]
